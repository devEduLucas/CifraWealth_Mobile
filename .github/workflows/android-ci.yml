name: Android Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types-and-doctor:
    name: TypeScript and Expo diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align dependencies with Expo SDK
        run: npx expo install --fix

      - name: Persist SDK-compatible dependency versions
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo dependencies are already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align packages with Expo SDK 58"
          git push origin "HEAD:${BRANCH_NAME}"

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

  android-debug:
    name: Prebuild and compile Android
    runs-on: ubuntu-latest
    needs: types-and-doctor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cifrawealth-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
